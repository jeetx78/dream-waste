  <circle cx="200" cy="170" r="5" fill="#1E293B"/>

  <!-- Green Hands -->
  <path
    d="M130 135 C130 185 185 205 195 208 C190 190 170 170 150 155 Z"
    fill="#00A859"
  />

  <path
    d="M270 135 C270 185 215 205 205 208 C210 190 230 170 250 155 Z"
