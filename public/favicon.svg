  <circle cx="160" cy="55" r="5" fill="#1E293B"/>
  <circle cx="200" cy="40" r="5" fill="#1E293B"/>
  <circle cx="240" cy="55" r="5" fill="#1E293B"/>

  <!-- Inner DWS Box -->
  <rect
